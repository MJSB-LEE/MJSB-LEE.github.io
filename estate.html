<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estate · MJSB Portal</title>
<style>
  :root{--bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#cbd5e1;--navy:#0f172a}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:var(--navy);color:#fff;padding:22px 16px;text-align:center;position:relative}
  header h1{margin:0;font-size:1.4rem;font-weight:800}
  header p{margin:6px 0 0;color:#94a3b8;font-size:.9rem}
  .back{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#fff;text-decoration:none;font-size:.9rem;font-weight:600;border:1px solid #334155;border-radius:8px;padding:8px 14px;background:#1e293b}
  .back:hover{background:#334155}
  main{max-width:1080px;margin:40px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,320px));gap:20px;justify-content:center}
  a.card{display:block;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:26px 24px;text-decoration:none;color:inherit;border-top:5px solid var(--c);transition:transform .12s,box-shadow .12s}
  .card.soon{display:block;background:#f8fafc;border:1px dashed var(--border);border-radius:14px;padding:26px 24px;border-top:5px solid var(--c);opacity:.75;cursor:default}
  a.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,23,42,.12)}
  .icon{font-size:2.2rem}
  .card h2{margin:10px 0 6px;font-size:1.15rem;color:var(--navy)}
  .card p{margin:0 0 16px;color:var(--muted);font-size:.9rem;line-height:1.45}
  .go{font-weight:700;color:var(--c);font-size:.9rem}
  .tip{max-width:700px;margin:0 auto 30px;padding:0 16px;color:var(--muted);font-size:.85rem;text-align:center}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px 16px}
  @media (max-width:600px){ .back{position:static;transform:none;display:inline-block;margin-bottom:12px} main{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <a class="back" href="./">← Back</a>
  <h1>Estate</h1>
  <p>Choose a module</p>
</header>
<main id="mods"></main>
<p class="tip">📱 Using it at the estate with no signal? Open <b>Site Visit</b> once with internet, then add it to your home screen. The portal pages need internet; Site Visit does not.</p>
<footer>MJSB Portal › Estate</footer>
<script>
/* ===== EDIT HERE to add estate modules =====
   link = where the module is. "estate/" = the GitHub repo named "estate"
   soon:true = shows "Coming soon" and cannot be clicked */
const MODULES = [
  { icon:'📷', name:'Site Visit', desc:'Lawatan ladang photo report. Works offline, prints 1/2/4 photos per A4, syncs to Google Drive.', link:'estate/', color:'#1f6f43' },
];
document.getElementById('mods').innerHTML = MODULES.map(m => m.soon
  ? `<div class="card soon" style="--c:${m.color}"><div class="icon">${m.icon}</div><h2>${m.name}</h2><p>${m.desc}</p><span class="go">Coming soon</span></div>`
  : `<a class="card" href="${m.link}" style="--c:${m.color}">
     <div class="icon">${m.icon}</div><h2>${m.name}</h2><p>${m.desc}</p><span class="go">Open →</span>
   </a>`).join('');
</script>
</body>
</html>
